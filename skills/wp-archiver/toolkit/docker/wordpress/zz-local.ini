; Elementor + media-heavy admin screens need more than the image defaults.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; The WordPress tree is bind-mounted from a Windows drive, where every file stat is slow. Cache
; compiled code and resolved paths aggressively; after editing PHP/plugin files, restart the
; container (docker compose restart wordpress) or wait out the revalidate window.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 300
realpath_cache_size = 4096K
realpath_cache_ttl = 600
